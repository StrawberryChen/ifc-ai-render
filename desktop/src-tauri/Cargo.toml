[package]
name = "ifc-ai-render-desktop"
version = "0.1.0"
description = "Architectural visualization desktop workstation"
authors = ["IFC AI Render"]
edition = "2021"

[lib]
name = "ifc_ai_render_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
